{% load i18n %}
{% if ok %}
  <div class="alert alert-success">
    <svg class="alert-icon" aria-hidden="true">
      <use href="#i-approve"/>
    </svg>
    <div class="alert-content">
      {{ ok }}
    </div>
  </div>
{% endif %}

{% if error %}
  <div class="alert alert-warning">
    <svg class="alert-icon" aria-hidden="true">
      <use href="#i-alert"/>
    </svg>
    <div class="alert-content">
      {{ error }}
    </div>
  </div>
{% endif %}

{% comment %} OOB: po wysyłce zawsze podmieniamy listę i przyciski {% endcomment %}
{% if draft_oob %}{{ draft_oob|safe }}{% endif %}
{% if draft_actions_oob %}{{ draft_actions_oob|safe }}{% endif %}

<style>
.alert {
  display: flex;
  align-items: flex-start;
  gap: var(--space-sm);
  padding: var(--space-md);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-md);
  font-size: var(--font-size-sm);
  border: 1px solid;
}

.alert-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  margin-top: 2px;
}

.alert-content {
  flex: 1;
}

.alert-success {
  background: #f0fdf4;
  border-color: #86efac;
  color: #166534;
}

.alert-success .alert-icon {
  color: #16a34a;
}

.alert-warning {
  background: #fffbeb;
  border-color: #fde68a;
  color: #92400e;
}

.alert-warning .alert-icon {
  color: #f59e0b;
}
</style>
