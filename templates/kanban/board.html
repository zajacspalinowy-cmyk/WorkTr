{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}Kanban - WorkTrack{% endblock %}

{% block content %}
<div class="kiosk-container">
  <!-- Compact Header -->
  <div class="kiosk-header">
    <div class="header-left">
      <svg class="header-icon" aria-hidden="true">
        <use href="#i-kanban"/>
      </svg>
      <div class="header-info">
        <h1 class="header-title">{% trans "Tablica Kanban" %}</h1>
        <p class="header-subtitle">{% trans "Status projektów w czasie rzeczywistym"%}</p>
      </div>
    </div>
    <div class="header-right">
      <button type="button"
              onclick="document.documentElement.requestFullscreen()"
              class="btn btn-secondary btn-icon"
              title="Tryb pełnoekranowy">
        <svg class="ico" aria-hidden="true">
          <use href="#i-search"/>
        </svg>
      </button>
      <a href="{% url 'kanban:archive' %}" class="btn btn-secondary">
        <svg class="ico" aria-hidden="true">
          <use href="#i-folder"/>
        </svg>
        <span>{% trans "Archiwum" %}</span>
      </a>
    </div>
  </div>

  <!-- Kanban Board - auto-refresh co 30s -->
  <div id="kanban-board"
       class="kiosk-board"
       hx-get="{% url 'kanban:board' %}"
       hx-trigger="revealed, every 30s"
       hx-swap="outerHTML">
    {% include "kanban/_board_inner.html" %}
  </div>
</div>

<style>
/* ========== KIOSK LAYOUT - FULLSCREEN ========== */
.kiosk-container {
  width: 100%;
  height: 100vh;
  margin: 0;
  padding: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-bg-secondary);
}

/* ========== COMPACT HEADER ========== */
.kiosk-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--color-bg);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-md);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-icon {
  width: 32px;
  height: 32px;
  color: var(--color-primary);
  flex-shrink: 0;
}

.header-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.header-title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-text);
  line-height: 1;
}

.header-subtitle {
  margin: 0;
  font-size: 0.875rem;
  color: var(--color-text-secondary);
  line-height: 1;
}

.header-right {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-icon {
  padding: 8px;
  min-width: auto;
}

/* ========== BOARD - FULL HEIGHT ========== */
.kiosk-board {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ========== GRID - 6 COLUMNS ALWAYS ========== */
.kanban-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  width: 100%;
  height: 100%;
  min-height: 0;
}

/* ========== COLUMNS ========== */
.kanban-col {
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  min-height: 0;
}

.col-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--color-bg-secondary);
  border-bottom: 2px solid var(--color-border);
  flex-shrink: 0;
}

.col-header h3 {
  margin: 0;
  font-weight: 700;
  color: var(--color-text);
  font-size: 1.125rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 10px;
  font-size: 1rem;
  font-weight: 700;
  background: var(--color-bg);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-full);
  color: var(--color-text);
}

/* ========== LIST - ONLY HERE IS SCROLL ========== */
.kanban-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

.kanban-list::-webkit-scrollbar {
  width: 8px;
}

.kanban-list::-webkit-scrollbar-track {
  background: var(--color-bg-secondary);
  border-radius: var(--radius-sm);
}

.kanban-list::-webkit-scrollbar-thumb {
  background: var(--color-border);
  border-radius: var(--radius-sm);
}

.kanban-list::-webkit-scrollbar-thumb:hover {
  background: var(--color-text-muted);
}

.kanban-list .empty {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 12px;
  color: var(--color-text-muted);
  font-size: 0.875rem;
  font-style: italic;
  text-align: center;
  border: 2px dashed var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-secondary);
}

.kanban-list.drop-hover {
  background: rgba(37, 99, 235, 0.05);
  outline: 3px dashed var(--color-primary);
  outline-offset: -8px;
}

/* ========== CARDS - COMPACT & READABLE ========== */
.project-card {
  background: var(--color-bg);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: all 0.2s ease;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  flex-shrink: 0;
}

.project-card:active {
  cursor: grabbing;
}

.project-card:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.project-card.dragging {
  opacity: 0.5;
  cursor: grabbing;
  transform: rotate(3deg);
  box-shadow: var(--shadow-xl);
}

.project-card[data-can-drag="0"] {
  cursor: default;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--color-bg-secondary);
  border-bottom: 1px solid var(--color-border);
}

.card-number {
  font-size: 1rem;
  font-weight: 700;
  font-family: 'SF Mono', Consolas, monospace;
  color: var(--color-primary);
  background: rgba(37, 99, 235, 0.1);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
}

.card-status-badge {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
  border: 2px solid var(--color-bg);
  box-shadow: var(--shadow-sm);
}

.status-BACKLOG { background: var(--color-text-muted); }
.status-IN_PROGRESS { background: var(--color-primary); }
.status-BLOCKED { background: var(--color-error); }
.status-REVIEW { background: var(--color-warning); }
.status-DONE { background: var(--color-success); }
.status-CANCELLED { background: var(--color-text-secondary); }

.card-body {
  padding: 12px;
  cursor: pointer;
}

.card-body:hover {
  background: var(--color-bg-secondary);
}

.card-name {
  margin: 0 0 8px 0;
  font-size: 1rem;
  font-weight: 600;
  color: var(--color-text);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-client,
.card-location,
.card-date,
.card-assigned {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--color-text-secondary);
  font-size: 0.875rem;
  line-height: 1.3;
}

.card-date {
  color: var(--color-primary);
  font-weight: 500;
}

.card-assigned {
  color: var(--color-text);
  font-weight: 500;
}

.card-icon {
  width: 16px;
  height: 16px;
  color: var(--color-text-muted);
  flex-shrink: 0;
}

.card-footer {
  padding: 8px 12px;
  background: var(--color-bg-secondary);
  border-top: 1px solid var(--color-border);
}

.card-status-form {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-label {
  font-size: 0.875rem;
  color: var(--color-text-secondary);
  font-weight: 500;
}

.status-select {
  flex: 1;
  padding: 6px 8px;
  font-size: 0.875rem;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  cursor: pointer;
  transition: all 0.2s ease;
}

.status-select:hover {
  border-color: var(--color-text-muted);
}

.status-select:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

/* ========== RESPONSIVE (dla testów) ========== */
@media (max-width: 1400px) {
  .kanban-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 900px) {
  .kanban-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .kanban-grid {
    grid-template-columns: 1fr;
  }

  .header-subtitle {
    display: none;
  }
}

/* ========== ANIMATION ========== */
@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(-10px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.card-moved {
  animation: cardAppear 0.3s ease;
}
</style>
{% endblock %}
